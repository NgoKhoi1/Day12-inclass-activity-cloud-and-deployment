services:
  - type: web
    name: cloud-ai-agent-starter
    env: docker
    healthCheckPath: /health
    envVars:
      - key: APP_API_KEY
        sync: false
      - key: APP_VERSION
        value: 0.1.0
      - key: ENVIRONMENT
        value: production
      - key: MAX_QUESTION_CHARS
        value: "2000"
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
